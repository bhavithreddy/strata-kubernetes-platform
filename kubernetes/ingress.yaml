apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-demo
  namespace: platform-demo
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - platform.local
      secretName: platform-demo-tls
  rules:
    - host: platform.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: platform-api
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: platform-api
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: platform-api
                port:
                  number: 8000
          - path: /redoc
            pathType: Prefix
            backend:
              service:
                name: platform-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-frontend
                port:
                  number: 80
