
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-developer-viewer
  namespace: platform-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-developer
  namespace: platform-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-developer-viewer-binding
  namespace: platform-demo
subjects:
  - kind: ServiceAccount
    name: platform-developer
    namespace: platform-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-developer-viewer
