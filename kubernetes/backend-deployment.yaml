apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      serviceAccountName: platform-api
      automountServiceAccountToken: false

      containers:
        - name: platform-api
          image: platform-api:0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: KUBERNETES_NAMESPACE
              value: platform-demo

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10

          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true

      volumes:
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform-demo
spec:
  type: ClusterIP
  selector:
    app: platform-api
  ports:
    - name: http
      port: 8000
      targetPort: http
