
# Strata monitoring configuration
# kube-prometheus-stack 92.17.0

defaultRules:
  create: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        cpu: 200m
        memory: 200Mi

grafana:
  enabled: true
  replicas: 1
  adminUser: admin
  persistence:
    enabled: true
    type: pvc
    storageClassName: standard
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 150Mi
    limits:
      cpu: 300m
      memory: 300Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 24h
    retentionSize: 4GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 300Mi
      limits:
        cpu: 500m
        memory: 600Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi

kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi

nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 40Mi
    limits:
      cpu: 100m
      memory: 100Mi

# Disable Windows-specific monitoring
windowsMonitoring:
  enabled: false

# Disable unnecessary optional components
thanosRuler:
  enabled: false
