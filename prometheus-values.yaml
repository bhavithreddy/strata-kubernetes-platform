alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

server:
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    storageClass: standard

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

  global:
    scrape_interval: 30s
    scrape_timeout: 10s
    evaluation_interval: 30s

  retention: "24h"
  retentionSize: "1GB"

  service:
    enabled: true
    type: ClusterIP
    servicePort: 80
