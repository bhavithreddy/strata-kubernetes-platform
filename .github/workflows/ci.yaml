
name: Strata DevSecOps CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2

  backend-checks:
    name: Backend Security and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx bandit pip-audit

      - name: Run backend tests
        run: |
          pytest -v backend/tests/

      - name: Run Bandit security scan
        run: |
          bandit -r backend/app app/app.py -ll

      - name: Audit backend dependencies
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

      - name: Audit demo application dependencies
        continue-on-error: true
        run: pip-audit -r app/requirements.txt

  frontend-checks:
    name: Frontend Security and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        continue-on-error: true
        run: npm audit --audit-level=moderate
