name: Strata DevSecOps CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: strata-ci-${{ github.ref }}
  cancel-in-progress: false


jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2

  backend-checks:
    name: Backend Security and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx bandit pip-audit

      - name: Run backend tests
        run: pytest -v backend/tests/

      - name: Run Bandit security scan
        run: bandit -r backend/app app/app.py -ll

      - name: Audit backend dependencies
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

      - name: Audit demo application dependencies
        continue-on-error: true
        run: pip-audit -r app/requirements.txt

  frontend-checks:
    name: Frontend Security and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        continue-on-error: true
        run: npm audit --audit-level=moderate

  container-security:
    name: Container Build, Scan and Publish
    needs: [secret-scan, backend-checks, frontend-checks]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - image: demo
            context: ./app
            dockerfile: ./app/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/strata-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/strata-${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Generate image SBOM
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/strata-${{ matrix.image }}:${{ github.sha }}
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom-${{ matrix.image }}.json \
            "$IMAGE"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: strata-${{ matrix.image }}-sbom
          path: sbom-${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}



      - name: Publish image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: publish
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/strata-${{ matrix.image }}:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          DIGEST=$(docker image inspect "$IMAGE" \
            --format='{{index .RepoDigests 0}}' | cut -d '@' -f 2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: sigstore/cosign-installer@v3.9.2

      - name: Sign container image with Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/strata-${{ matrix.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"


  update-gitops:
    name: Update GitOps Image Tags
    needs: [container-security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tags
        run: |
          kustomize edit set image \
            platform-api=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/strata-backend:${GITHUB_SHA} \
            platform-demo=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/strata-demo:${GITHUB_SHA} \
            platform-frontend=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/strata-frontend:${GITHUB_SHA}


      - name: Commit and push GitOps changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kustomization.yaml

          if git diff --cached --quiet; then
            echo "No GitOps changes to commit."
            exit 0
          fi

          git commit -m "chore(gitops): update images to ${GITHUB_SHA}"
          git push origin HEAD:master
