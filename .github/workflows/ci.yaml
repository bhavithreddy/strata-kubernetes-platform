
name: Strata DevSecOps CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2

  backend-checks:
    name: Backend Security and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx bandit pip-audit

      - name: Run backend tests
        run: pytest -v backend/tests/

      - name: Run Bandit security scan
        run: bandit -r backend/app app/app.py -ll

      - name: Audit backend dependencies
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

      - name: Audit demo application dependencies
        continue-on-error: true
        run: pip-audit -r app/requirements.txt

  frontend-checks:
    name: Frontend Security and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        continue-on-error: true
        run: npm audit --audit-level=moderate

  container-security:
    name: Container Build, Scan and Publish
    needs: [secret-scan, backend-checks, frontend-checks]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - image: demo
            context: ./app
            dockerfile: ./app/Dockerfile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/strata-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/strata-${{ matrix.image }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Generate image SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/strata-${{ matrix.image }}:${{ github.sha }}
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom-${{ matrix.image }}.json \
            "$IMAGE"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: strata-${{ matrix.image }}-sbom
          path: sbom-${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/strata-${{ matrix.image }}:${{ github.sha }}
        run: docker push "$IMAGE"
